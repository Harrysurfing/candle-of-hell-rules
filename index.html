<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#140c09" />
    <meta
      name="description"
      content="彼岸之烛桌边规则速查：按故事模式与冒险模式查阅。"
    />
    <title>彼岸之烛 · 规则速查</title>
    <link
      rel="preload"
      href="./fonts/noto-sans-sc-chinese-simplified-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="manifest" href="./manifest.json" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23140c09'/%3E%3Cellipse cx='32' cy='20' rx='7' ry='13' fill='%23c4452f'/%3E%3Cellipse cx='32' cy='18' rx='4' ry='8' fill='%23e0b05a'/%3E%3Crect x='29' y='32' width='6' height='20' rx='1' fill='%23d7c4a0'/%3E%3C/svg%3E"
    />
  </head>
  <body class="mode-story">
    <div class="bg" aria-hidden="true"></div>
    <div class="frame">
      <div class="app">
        <header class="hero">
          <h1 class="brand">彼岸之烛</h1>
          <p class="tagline">规则速查</p>
          <p class="disclaimer" id="disclaimer"></p>
        </header>

        <div class="mode-switch" role="tablist" aria-label="游戏模式">
          <button type="button" class="mode-btn" data-mode="story" role="tab" aria-selected="true">
            <span class="mode-kicker">城镇 · 抉择</span>
            <span class="mode-name">故事模式</span>
          </button>
          <button type="button" class="mode-btn" data-mode="adventure" role="tab" aria-selected="false">
            <span class="mode-kicker">倒斗 · 战斗</span>
            <span class="mode-name">冒险模式</span>
          </button>
        </div>

        <div class="toolbar">
          <div class="search">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" />
              <path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
            <label class="sr-only" for="q">搜索规则</label>
            <input id="q" type="search" placeholder="在当前模式中搜索…" autocomplete="off" enterkeyhint="search" />
            <button type="button" class="clear" id="clear" hidden>清除</button>
          </div>
          <nav class="nav" id="nav" aria-label="本模式分类"></nav>
          <p class="result-bar" id="resultBar" hidden></p>
        </div>

        <section class="faq-wrap" aria-label="常见问题">
          <p class="kicker">桌边常问</p>
          <div class="faqs" id="faqs"></div>
        </section>

        <section class="flow" id="flow" aria-label="流程速览">
          <article class="flow-card story">
            <h2>故事一回</h2>
            <ol class="flow-steps">
              <li>1–2 行动或跳过</li>
              <li>移动 / 互动</li>
              <li>全体跳过 → 尾声</li>
            </ol>
          </article>
          <article class="flow-card adventure">
            <h2>冒险一轮</h2>
            <ol class="flow-steps">
              <li>结算威胁区</li>
              <li>调度 + 最多 2 牌</li>
              <li>抽遭遇 → 奇门</li>
              <li>敌人阶段</li>
            </ol>
          </article>
        </section>

        <section id="tables" class="tables" aria-label="对照表"></section>
        <section id="glossary" aria-label="术语"></section>
        <main id="main"></main>
        <p class="empty" id="empty">当前模式没有匹配。试试换一个词，或切到另一模式。</p>
      </div>
    </div>

    <div class="dock">
      <a href="#top" id="toTop">顶部</a>
      <button type="button" id="expandPins">展开必记</button>
      <button type="button" id="collapseAll">全部收起</button>
    </div>

    <script src="./data.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
